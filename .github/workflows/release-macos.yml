name: Release macOS app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Apple distribution configuration
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          required_names=(
            APPLE_TEAM_ID
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            DEVELOPER_ID_APPLICATION_P12_BASE64
            DEVELOPER_ID_APPLICATION_P12_PASSWORD
            APP_STORE_CONNECT_API_KEY_P8_BASE64
          )
          missing=0

          for required_name in "${required_names[@]}"; do
            if [[ -z "${!required_name}" ]]; then
              echo "::error::GitHub Actions configuration is missing: ${required_name}"
              missing=1
            fi
          done

          exit "${missing}"

      - name: Import Developer ID Application certificate
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          keychain_path="${RUNNER_TEMP}/marina-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          trap 'rm -f "${certificate_path}"' EXIT
          echo "SIGNING_KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"

          printf '%s' "${DEVELOPER_ID_APPLICATION_P12_BASE64}" \
            | base64 --decode > "${certificate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${DEVELOPER_ID_APPLICATION_P12_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          signing_identities="$(
            security find-identity -v -p codesigning "${keychain_path}" \
              | awk -F'"' '/Developer ID Application:/ {print $2}'
          )"
          identity_count="$(
            printf '%s\n' "${signing_identities}" \
              | awk 'NF { count++ } END { print count + 0 }'
          )"

          if [[ "${identity_count}" -ne 1 ]]; then
            echo "::error::Developer ID Application identity must be exactly one; found ${identity_count}"
            exit 1
          fi

          signing_identity="${signing_identities}"
          if [[ "${signing_identity}" != *"(${APPLE_TEAM_ID})" ]]; then
            echo "::error::Developer ID Application identity does not match APPLE_TEAM_ID"
            exit 1
          fi

          echo "SIGNING_IDENTITY=${signing_identity}" >> "${GITHUB_ENV}"

      - name: Run tests
        run: |
          xcodebuild \
            -project Marina.xcodeproj \
            -scheme Marina \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/test \
            test

      - name: Build Universal macOS app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-macos-release.sh

      - name: Notarize and staple macOS app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          app_path="build/release/DerivedData/Build/Products/Release/Marina.app"
          archive_path="build/release/Marina-macos-universal.zip"
          api_key_path="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          result_path="${RUNNER_TEMP}/notarization-result.json"
          trap 'rm -f "${api_key_path}" "${result_path}"' EXIT

          printf '%s' "${APP_STORE_CONNECT_API_KEY_P8_BASE64}" \
            | base64 --decode > "${api_key_path}"
          chmod 600 "${api_key_path}"

          submit_exit=0
          xcrun notarytool submit "${archive_path}" \
            --key "${api_key_path}" \
            --key-id "${APP_STORE_CONNECT_KEY_ID}" \
            --issuer "${APP_STORE_CONNECT_ISSUER_ID}" \
            --wait \
            --timeout 30m \
            --output-format json > "${result_path}" || submit_exit=$?

          cat "${result_path}"

          if [[ "${submit_exit}" -ne 0 ]]; then
            echo "::error::Apple notarization submission failed"
            exit "${submit_exit}"
          fi

          notarization_status="$(
            plutil -extract status raw -o - "${result_path}"
          )"
          if [[ "${notarization_status}" != "Accepted" ]]; then
            echo "::error::Apple notarization was not accepted: ${notarization_status}"
            exit 1
          fi

          xcrun stapler staple "${app_path}"
          xcrun stapler validate "${app_path}"
          spctl --assess --type execute --verbose=4 "${app_path}"

          ./scripts/package-macos-release.sh

      - name: Upload notarized test artifact
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Marina-macos-notarized-${{ github.run_number }}
          path: |
            build/release/Marina-macos-universal.zip
            build/release/Marina-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Read release metadata
        if: github.ref == 'refs/heads/main'
        id: release
        shell: bash
        run: |
          set -euo pipefail

          info_plist="build/release/DerivedData/Build/Products/Release/Marina.app/Contents/Info.plist"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${info_plist}")"

          if [[ -z "${version}" ]]; then
            echo "error: アプリのバージョンを取得できません" >&2
            exit 1
          fi

          echo "tag=v${version}.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "title=Marina v${version}.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail

          asset_paths=(
            build/release/Marina-macos-universal.zip
            build/release/Marina-macos-universal.zip.sha256
          )

          release_state="$(
            gh api graphql \
              -f query='query($owner:String!,$repository:String!,$tag:String!){repository(owner:$owner,name:$repository){release(tagName:$tag){isDraft}}}' \
              -f owner="${GITHUB_REPOSITORY%%/*}" \
              -f repository="${GITHUB_REPOSITORY#*/}" \
              -f tag="${RELEASE_TAG}" \
              --jq '.data.repository.release | if . == null then "missing" elif .isDraft then "draft" else "published" end'
          )"

          if [[ "${release_state}" == "missing" ]]; then
            gh release create "${RELEASE_TAG}" "${asset_paths[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --generate-notes
            exit 0
          fi

          existing_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          if [[ "${release_state}" == "draft" ]]; then
            for asset_path in "${asset_paths[@]}"; do
              asset_name="$(basename "${asset_path}")"
              if grep -Fxq "${asset_name}" <<< "${existing_assets}"; then
                gh release delete-asset "${RELEASE_TAG}" "${asset_name}" --yes
              fi
            done

            gh release upload "${RELEASE_TAG}" "${asset_paths[@]}"
            gh release edit "${RELEASE_TAG}" --draft=false
            exit 0
          fi

          for asset_path in "${asset_paths[@]}"; do
            asset_name="$(basename "${asset_path}")"
            if ! grep -Fxq "${asset_name}" <<< "${existing_assets}"; then
              echo "error: 公開済みReleaseにassetが不足しています: ${asset_name}" >&2
              exit 1
            fi
          done

          echo "Release assets already exist: ${RELEASE_TAG}"

      - name: Remove temporary signing keychain
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH}" && -f "${SIGNING_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN_PATH}"
          fi
